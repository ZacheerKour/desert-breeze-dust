; Phantom Dust PC settings. Edit, save, then start the game again (PLAY.bat). Lines starting with ; are comments.
; Missing lines use the defaults shown here. F11 or Alt+Enter still toggles borderless full screen while playing.

; Start in borderless full screen: 0 = window, 1 = full screen
fullscreen=0

; Window size in pixels (client area): auto (1280 wide), or e.g. 1280x960, 1920x1080, 2560x1440
window=auto

; Internal render scale (multiples of the original 640x480): auto (follows the window), or 1 to 8
render_scale=auto

; Picture aspect ratio: 4:3 (original) or 16:9 (experimental, widens the view)
aspect=4:3

; 60 FPS in-between frames (EXPERIMENTAL, can cause black cutscenes or shaking on fast PCs): 1 = on, 0 = original 30 FPS
interpolation=0

; Wait for the monitor refresh (no tearing): 1 = on, 0 = off
vsync=1

; Keyboard layout: mmo (WASD, 1-4 skills, Tab lock on) or classic (Z X A S, numpad stick)
keys=mmo
